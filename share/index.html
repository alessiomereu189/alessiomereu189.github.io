<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d2b"><title>Apri in AccordAle</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172235;background:#f8f6f1}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(440px,calc(100% - 32px));padding:28px;background:white;border:1px solid #e8e0d6;border-radius:20px;box-shadow:0 15px 45px #17223518}h1{margin:0 0 10px;font-size:30px}.brand{color:#d87927}p{line-height:1.5;color:#586174}.button{display:block;margin:26px 0 12px;padding:15px 20px;background:#172235;color:white;text-align:center;text-decoration:none;border-radius:12px;font-weight:700}.fallback{font-size:14px}code{overflow-wrap:anywhere}</style></head><body><main><h1>Accord<span class="brand">Ale</span></h1><p>Hai ricevuto delle canzoni. Apri AccordAle sul telefono per aggiungerle al tuo archivio.</p><a class="button" id="open-app" hidden>Apri in AccordAle</a><p class="fallback" id="fallback" hidden>Se il pulsante non funziona, apri AccordAle → ⋮ → Importa condivisione e incolla il <a id="gist-link">link dei brani</a>.</p><p id="invalid" hidden>Questo link non contiene una condivisione valida.</p></main><script>const id=new URLSearchParams(location.search).get('id');if(id&&/^[a-f0-9]{20,64}$/i.test(id)){const app=document.getElementById('open-app'),gist=document.getElementById('gist-link');app.href='accordale://share/'+id;gist.href='https://gist.github.com/'+id;app.hidden=false;document.getElementById('fallback').hidden=false}else document.getElementById('invalid').hidden=false;</script></body></html>
